server:
  address: 127.0.0.1
  port: ${PORT:5175}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    resources:
      static-locations: ${FRONTEND_LOCATION:file:../frontend/}
      cache:
        cachecontrol:
          no-store: true
skin:
  storage-type: ${SKIN_STORAGE_TYPE:file}
  storage: ${SKIN_STORAGE:./data}
deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
skinfusion:
  url: ${SKINFUSION_URL:http://127.0.0.1:8000}
  api-key: ${SKINFUSION_API_KEY:}
  dataset-dir: ${ISIC_DATASET_DIR:isic-dataset}




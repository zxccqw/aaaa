<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 医疗检验工作台</title>
<style>
  *{box-sizing:border-box}
  :root{--navy:#25364b;--navy-deep:#1d2b3d;--blue:#4773ce;--blue-dark:#324359;--line:#d8e1ea;--text:#354b65;--muted:#7b8fa5;--ok:#1f8a5b;--err:#c0392b}
  html,body{min-height:100%;height:100%}
  body{margin:0;background:radial-gradient(1200px 600px at 15% 0%,#f3f7fc 0%,#e8edf3 55%,#e2e8ef 100%);color:var(--text);font:16px/1.6 Inter,"Microsoft YaHei",system-ui,sans-serif}
  .shell{display:grid;grid-template-columns:1.05fr .95fr;width:100%;max-width:none;min-height:100vh;margin:0;background:#fff;border:0;border-radius:0;overflow:hidden;box-shadow:none}
  .brand{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(32px,6vh,72px) clamp(32px,5vw,76px);color:#eaf2fb;background:linear-gradient(155deg,#22334a 0%,#2a3b53 52%,#274d64 100%)}
  .brand::after{content:"";position:absolute;right:-90px;bottom:-120px;width:320px;height:320px;border-radius:50%;background:rgba(93,168,214,.12);pointer-events:none}
  .logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;letter-spacing:.4px}
  .logo-mark{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:#4773ce;color:#fff;font-size:20px;font-weight:400}
  .brand h1{font-size:clamp(30px,3.2vw,48px);line-height:1.3;margin:0 0 16px;font-weight:700;letter-spacing:.5px}
  .brand p.lead{margin:0 0 28px;color:#b9cbe0;font-size:clamp(14px,1.1vw,17px)}
  .feature{display:flex;align-items:flex-start;gap:10px;font-size:clamp(13px,1vw,15px);color:#cfdcec;margin:0 0 14px}
  .feature i{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);color:#9fd0f0;font-style:normal;font-size:11px;flex:none;margin-top:2px}
  .brand-foot{font-size:11px;color:#8fa7c1;letter-spacing:.3px}
  main{display:flex;flex-direction:column;justify-content:center;width:100%;max-width:680px;margin:0 auto;padding:clamp(32px,6vh,64px) clamp(32px,4vw,60px) 28px}
  header h2{font-size:clamp(26px,2.1vw,34px);margin:0 0 8px;color:#25364b}
  header p{margin:0 0 26px;color:var(--muted);font-size:13px}
  .field{margin-bottom:16px}
  .field label{display:block;font-weight:600;font-size:13px;color:#3c5670;margin-bottom:6px}
  input{display:block;width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;font:inherit;transition:border-color .15s,box-shadow .15s}
  input:focus{outline:none;border-color:#7fa8e6;box-shadow:0 0 0 3px rgba(71,115,206,.14)}
  input[aria-invalid="true"]{border-color:#d98b84;box-shadow:0 0 0 3px rgba(192,57,43,.1)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .eye{border:0;background:transparent;color:#5d7690;font-size:12px;padding:4px 2px;cursor:pointer}
  .eye:hover{color:var(--blue)}
  .options{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px;gap:12px;font-size:12px;color:#6c8198}
  .check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .check input{width:15px;height:15px;margin:0;accent-color:var(--blue)}
  .options .forgot{color:#5d7690;text-decoration:none}
  .caps{margin:-6px 0 12px;color:#b26a00;font-size:12px;background:#fff7e8;border:1px solid #f0d9a8;border-radius:6px;padding:6px 9px}
  .submit{width:100%;height:52px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;letter-spacing:1px;cursor:pointer;transition:background .15s}
  .submit:hover{background:#3c63b8}
  .submit:disabled{background:#9db3d8;cursor:wait}
  .status{min-height:22px;margin:12px 0 0;font-size:12px;color:var(--muted)}
  .status.error{color:var(--err)}
  .status.ok{color:var(--ok)}
  .session{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:10px 12px;border:1px solid #c7ddcf;background:#f1faf5;border-radius:8px;font-size:12px;color:#2f6b4d}
  .session strong{font-weight:700}
  .session-actions{display:flex;gap:8px}
  .session button{height:30px;padding:0 12px;border:1px solid #b7d8c5;border-radius:6px;background:#fff;color:#2f6b4d;font-size:12px;cursor:pointer}
  .session button.primary{border-color:#2f8a5f;background:#2f8a5f;color:#fff}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid #eef2f7;font-size:11px;color:#9aabbb;text-align:center}
  [hidden]{display:none !important}
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;min-height:100vh;margin:0;border-radius:0}
    .brand{padding:26px 26px 22px}
    .brand h1{font-size:22px;margin-bottom:8px}
    .brand p.lead,.feature,.brand-foot{display:none}
    main{padding:30px 26px 22px}
    header h2{font-size:22px}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="brand">
    <div class="logo"><span class="logo-mark">✚</span><span>医疗检验工作台</span></div>
    <div>
      <h1>皮肤检验登记、诊断辅助与报告复核</h1>
      <p class="lead">面向医生的皮肤检验工作台，支持从数据集选图、AI 病灶分割与检查记录管理。</p>
      <p class="feature"><i>1</i><span>AI 病灶分割：本地 SkinFusion-Seg 模型，输出叠加图与预测掩码</span></p>
      <p class="feature"><i>2</i><span>检查记录：登记、复核、删除与工作记录留痕</span></p>
      <p class="feature"><i>3</i><span>原始数据不出域，分割在本机完成</span></p>
    </div>
  </aside>
  <main>
    <header>
      <h2>登录工作台</h2>
      <p>请使用医院分配的账号登录</p>
    </header>
    <div class="session" id="session-banner" hidden>
      <span>检测到已登录：<strong id="session-role">医生</strong></span>
      <span class="session-actions">
        <button type="button" id="session-enter">进入工作台</button>
        <button type="button" id="session-switch">切换账号</button>
      </span>
    </div>
    <form id="login" method="post" action="/api/auth/login">
      <div class="field">
        <label for="account">账号或邮箱</label>
        <input id="account" name="account" autocomplete="username" required autofocus spellcheck="false">
      </div>
      <div class="field">
        <div class="row">
          <label for="password">密码</label>
          <button id="toggle" class="eye" type="button" aria-controls="password" aria-pressed="false">显示密码</button>
        </div>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="caps" class="caps" hidden>大写锁定已开启</p>
      <div class="options">
        <label class="check"><input id="remember" type="checkbox" checked>记住账号</label>
        <span>忘记密码？请联系系统管理员</span>
      </div>
      <button class="submit" id="submit" type="submit">登录</button>
      <p id="status" class="status" role="status"></p>
    </form>
    <footer>医疗检验工作台 · 登录后按账号角色进入对应功能</footer>
  </main>
</div>
<script>
(() => {
  const form = document.getElementById('login');
  const account = document.getElementById('account');
  const password = document.getElementById('password');
  const toggle = document.getElementById('toggle');
  const remember = document.getElementById('remember');
  const status = document.getElementById('status');
  const caps = document.getElementById('caps');
  const submit = document.getElementById('submit');
  const banner = document.getElementById('session-banner');
  const sessionRole = document.getElementById('session-role');
  const DOCTOR_PAGES = new Set(['dashboard', 'lab']);
  const ADMIN_PAGES = new Set(['overview', 'training', 'encrypted', 'attestation', 'verification', 'chain3d', 'audit', 'screen', 'about', 'project', 'help', 'status', 'settings']);
  const next = (() => { try { return new URLSearchParams(location.search).get('next') || ''; } catch { return ''; } })();

  function landing(role) {
    if (role === 'admin') return 'screen';
    if (next && role === 'doctor' && DOCTOR_PAGES.has(next)) return next;
    return 'dashboard';
  }
  function go(role) { location.replace('/#' + landing(role)); }

  // 记住账号（只记账号，不存密码）
  const saved = localStorage.getItem('loginAccount') || '';
  if (saved) { account.value = saved; remember.checked = true; password.focus(); } else { account.focus(); }

  // 已有登录会话时提示进入/切换，不强制跳转
  fetch('/api/auth/session', { headers: { Accept: 'application/json' }, cache: 'no-store' }).then(async response => {
    if (!response.ok) return;
    const data = await response.json();
    if (!data || !data.role) return;
    sessionRole.textContent = data.role === 'admin' ? '管理员' : '医生';
    banner.hidden = false;
    document.getElementById('session-enter').onclick = () => go(data.role);
    document.getElementById('session-switch').onclick = async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      banner.hidden = true;
      status.textContent = '已退出当前账号，请重新登录。';
      status.className = 'status';
      account.focus();
    };
  }).catch(() => {});

  // 密码显隐
  toggle.addEventListener('click', () => {
    const hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    toggle.textContent = hidden ? '隐藏密码' : '显示密码';
    toggle.setAttribute('aria-pressed', String(hidden));
    password.focus();
  });

  // 大写锁定提示
  const updateCaps = event => {
    if (event.getModifierState) caps.hidden = !event.getModifierState('CapsLock');
  };
  password.addEventListener('keydown', updateCaps);
  password.addEventListener('keyup', updateCaps);

  function showError(message) {
    status.textContent = message;
    status.className = 'status error';
    account.setAttribute('aria-invalid', String(!account.value.trim()));
    password.setAttribute('aria-invalid', 'true');
  }
  function clearError() {
    status.textContent = '';
    status.className = 'status';
    account.removeAttribute('aria-invalid');
    password.removeAttribute('aria-invalid');
  }
  account.addEventListener('input', clearError);
  password.addEventListener('input', clearError);

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    const accountValue = account.value.trim();
    const passwordValue = password.value;
    clearError();
    submit.disabled = true;
    submit.textContent = '登录中…';
    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ account: accountValue, password: passwordValue })
      });
      let data = {};
      try { data = await response.json(); } catch { data = {}; }
      if (response.status === 401) {
        showError('账号或密码错误，请检查后重试。');
        password.select();
        password.focus();
        return;
      }
      if (!response.ok) {
        showError(data.error || ('登录失败（HTTP ' + response.status + '）'));
        return;
      }
      if (remember.checked) localStorage.setItem('loginAccount', accountValue);
      else localStorage.removeItem('loginAccount');
      status.textContent = '登录成功，正在进入…';
      status.className = 'status ok';
      go(data.role === 'admin' ? 'admin' : 'doctor');
    } catch {
      showError('无法连接登录服务，请确认后端已启动后重试。');
    } finally {
      submit.disabled = false;
      submit.textContent = '登录';
    }
  });
})();
</script>
<script>
(function () {
  try {
    if (new URLSearchParams(location.search).get('fast') === '1') {
      localStorage.setItem('fastTraining', String(Date.now()));
      setTimeout(function () { location.replace('/#training'); }, 350);
    }
  } catch (e) {}
})();
</script>
</body>
</html>

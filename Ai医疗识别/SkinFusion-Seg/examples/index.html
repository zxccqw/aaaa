<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkinFusion-Seg 原图分割测试</title>
<style>body{font:16px system-ui;max-width:1100px;margin:40px auto;padding:20px;background:#f5f7fa}input,button{font:inherit;padding:10px;margin:8px 0}button{background:#145ca8;color:white;border:0;border-radius:6px}section{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0;flex:1;min-width:250px}img{width:100%;max-height:600px;object-fit:contain;background:#ddd}#status{white-space:pre-wrap}</style>
<h1>SkinFusion-Seg</h1><p>选择皮肤病原图，自动生成病灶掩码与叠加图。无需上传真实掩码。</p>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp"><br><input id="key" type="password" placeholder="API Key（服务端设置后才需要）" autocomplete="off"><button id="run">开始分割</button><p id="status">支持 JPG / PNG / WebP，文件 ≤8 MiB、像素 ≤400万。</p>
<section><figure><figcaption>原图</figcaption><img id="original" alt="原图预览"></figure><figure><figcaption>预测掩码</figcaption><img id="mask" alt="预测病灶掩码"></figure><figure><figcaption>叠加图</figcaption><img id="overlay" alt="预测病灶叠加图"></figure></section>
<script>
const el=id=>document.getElementById(id);let data=null;
el('file').onchange=async()=>{data=null;el('mask').removeAttribute('src');el('overlay').removeAttribute('src');const f=el('file').files[0];if(!f)return;if(f.size>8*1024*1024){el('status').textContent='文件超过8 MiB';return;}const reader=new FileReader();reader.onload=()=>{data=reader.result;el('original').src=data;};reader.readAsDataURL(f);};
el('run').onclick=async()=>{if(!data){el('status').textContent='请先选择图片并等待加载';return;}el('run').disabled=true;el('status').textContent='正在分割…';try{const headers={'Content-Type':'application/json'};if(el('key').value)headers['X-API-Key']=el('key').value;const response=await fetch('/v1/segment',{method:'POST',headers,body:JSON.stringify({image_base64:data,include_overlay:true})});const result=await response.json();if(!response.ok)throw Error(JSON.stringify(result.detail));el('mask').src='data:image/png;base64,'+result.mask_png_base64;el('overlay').src='data:image/png;base64,'+result.overlay_png_base64;el('status').textContent=`完成 · ${result.width}×${result.height} · 推理 ${result.inference_ms} ms · 预测病灶像素占比 ${(result.lesion_area_ratio*100).toFixed(2)}%`;}catch(e){el('status').textContent='请求失败：'+e.message;}finally{el('run').disabled=false;}};
</script></html>
